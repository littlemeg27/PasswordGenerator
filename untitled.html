<!DOCTYPE html>
<html>
  <head>
    <title>Generate a Random Password using JavaScript</title>
  </head>

  <body style="text-align: center">
    <h1 style="color: blue">Charter Communications</h1>

    <h3>Click the button to generate random Active Directory password.</h3>

    <button onclick="ad_Run()">Click Here</button>
    <br />

    <div>
      <p id="ADPass"></p>
    </div>

    <script>
      var adPassword = document.getElementById("ADPass");

      /* Function to generate combination of password */
      function generateADPassword() {
        var passwordAD = "";
        var stringAD =
          "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
          "abcdefghijklmnopqrstuvwxyz" +
          "0123456789" +
          "!@#$%^&*+=<>?";

        for (let i = 1; i <= 12; i++) {
          var char = Math.floor(Math.random() * stringAD.length + 1);

          passwordAD += stringAD.charAt(char);
        }

        return passwordAD;
      }

      function ad_Run() {
        adPassword.innerHTML = generateADPassword();
      }
    </script>

    <h3>Click the button to generate random ADM password.</h3>

    <button onclick="adm_Run()">Click Here</button>
    <br />

    <div>
      <p id="ADMPass"></p>
    </div>

    <script>
      var admPassword = document.getElementById("ADMPass");

      /* Function to generate combination of password */
      function generateADMPassword() {
        var passwordADM = "";
        var stringADM =
          "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
          "abcdefghijklmnopqrstuvwxyz" +
          "0123456789" +
          "!@#$%^&*+=<>?";

        for (let i = 1; i <= 16; i++) {
          var char = Math.floor(Math.random() * stringADM.length + 1);

          passwordADM += stringADM.charAt(char);
        }

        return passwordADM;
      }

      function adm_Run() {
        admPassword.innerHTML = generateADMPassword();
      }
    </script>
  </body>
</html>
